<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>품태권도 오늘의 수련</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Brush+Script&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: one 1920×1080 stage scaled like a projected PPT. Each training day = its own class deck (인사 → 순서 → 명상 → 인성 → 준비운동 → 본운동 → 마무리). Single warm look for the dojang TV. */
:root{
  --taupe:#b9a593; --sand:#e9e1d7; --paper:#fbf8f4; --olive:#5d6e45; --olive-d:#3f4c2f;
  --ink:#2c2620; --muted:#7d7064; --red:#c8322b; --blue:#2b4fb8; --gold:#d9a02b;
  --f-display:"Black Han Sans","Noto Sans KR",sans-serif;
  --f-body:"Noto Sans KR",sans-serif;
  --f-brush:"Nanum Brush Script","Noto Sans KR",cursive;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#3a332c;color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#viewport{position:fixed;left:0;right:0;top:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));overflow:hidden}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--sand);overflow:hidden;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
.slide.on{opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.slide *{animation:none!important}}

/* shared decoration */
.blob{position:absolute;border-radius:50%;pointer-events:none}
.b1{width:760px;height:760px;right:-180px;top:-260px;background:#d8c9b9}
.b2{width:420px;height:420px;left:-140px;bottom:-200px;background:#cdbba8}
.b3{width:180px;height:180px;right:640px;top:-70px;background:#c6955a;opacity:.55}
.dots{position:absolute;right:120px;top:70px;width:200px;height:120px;background-image:radial-gradient(#fff 5px,transparent 6px);background-size:30px 30px;opacity:.85}
.mount{position:absolute;bottom:-6px;right:60px;width:420px}
.brand{position:absolute;left:90px;top:52px;font:700 26px/1 var(--f-body);letter-spacing:.18em;color:var(--muted);z-index:2}
.brand b{color:var(--olive)}
.step{position:absolute;right:90px;top:46px;font:700 26px/1 var(--f-body);color:var(--muted);z-index:4;font-variant-numeric:tabular-nums}
.photo{position:absolute;right:60px;bottom:40px;height:860px;max-width:740px;object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 24px 30px rgba(60,40,20,.25));animation:pop .7s .1s both}
@keyframes pop{from{transform:translateY(30px) scale(.97)}to{transform:none}}
@keyframes rise{from{transform:translateY(24px)}to{transform:none}}
.chip{font:700 30px/1 var(--f-body);padding:14px 26px;border-radius:999px;background:var(--ink);color:#fff;display:inline-block}
.chip.olive{background:var(--olive)} .chip.red{background:var(--red)} .chip.blue{background:var(--blue)}
.btn{font:700 32px/1 var(--f-body);border:0;border-radius:999px;padding:22px 34px;background:var(--olive);color:#fff;cursor:pointer}
.btn.dark{background:var(--ink)}
.btn.playing{background:var(--red)}
.btn:focus-visible{outline:4px solid var(--gold);outline-offset:4px}

/* 1. 오늘은 */
.s-cover{background:var(--taupe)}
.s-cover .b1{background:#c7b5a3}
.s-cover .olivebar{position:absolute;right:0;top:0;width:210px;height:420px;background:var(--olive)}
.s-cover .hello{position:absolute;left:110px;top:150px;font:400 96px/1 var(--f-display);color:#fff}
.s-cover .bigd{position:absolute;left:100px;top:260px;font:400 300px/0.9 var(--f-display);color:var(--ink);letter-spacing:-4px}
.s-cover .bigd small{font-size:150px;letter-spacing:0}
.s-cover .dw{position:absolute;left:112px;top:540px;font:400 96px/1 var(--f-display);color:#fff}
.s-cover .q{position:absolute;left:110px;top:680px;font:400 120px/1 var(--f-display);color:#fff}
.s-cover .q b{color:var(--olive-d);font-weight:400}
.s-cover .acts{position:absolute;left:110px;bottom:100px;display:flex;gap:18px}
.s-cover .photo{height:900px;right:40px;bottom:0}

/* 2. 수업 순서 */
.s-flow .title{position:absolute;left:110px;top:120px;font:400 110px/1 var(--f-display)}
.s-flow .title span{color:var(--olive)}
.flow{position:absolute;left:110px;top:290px;width:1100px;display:flex;flex-direction:column;gap:0}
.flow li{list-style:none;display:grid;grid-template-columns:76px 1fr;align-items:center;gap:26px;animation:rise .5s both}
.flow .no{width:76px;height:76px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:400 40px/1 var(--f-display)}
.flow .tx{font:400 54px/1.05 var(--f-display);padding:18px 0}
.flow .tx small{font:700 28px/1 var(--f-body);color:var(--muted);margin-left:16px}
.flow li.main .no{background:var(--olive)}
.flow li.main .tx{color:var(--olive-d)}
.flow li + li{position:relative}
.flow li + li::before{content:"";position:absolute;left:36px;top:-14px;width:4px;height:28px;background:var(--taupe)}
.s-flow .photo{height:760px}

/* 3. 음악 명상 */
.s-med{background:var(--olive-d);color:#f3efe6}
.s-med .ring{position:absolute;left:50%;top:50%;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;border:3px solid rgba(255,255,255,.25);animation:breath 8s ease-in-out infinite}
.s-med .ring.r2{width:860px;height:860px;margin:-430px 0 0 -430px;animation-delay:-4s;border-color:rgba(255,255,255,.12)}
@keyframes breath{0%,100%{transform:scale(.9)}50%{transform:scale(1.05)}}
.s-med .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center}
.s-med h2{margin:0;font:400 150px/1 var(--f-display);letter-spacing:30px;margin-right:-30px}
.s-med p{margin:0;font:700 44px/1.6 var(--f-body);color:#d9dccf}
.s-med .eyebrow{font:700 30px/1 var(--f-body);letter-spacing:.3em;color:#b8c59f}
.s-med .brand{color:#b8c59f}.s-med .brand b{color:#fff}.s-med .step{color:#b8c59f}

/* 4. 이달의 인성 */
.s-virtue{background:var(--paper)}
.s-virtue .eyebrow{position:absolute;left:132px;top:110px;font:700 30px/1 var(--f-body);letter-spacing:.2em;color:var(--olive)}
.s-virtue .brush{position:absolute;left:120px;top:140px;font:400 400px/1 var(--f-brush)}
.s-virtue .def{position:absolute;left:130px;top:560px;font:700 50px/1.5 var(--f-body);max-width:19em}
.s-virtue .def b{color:var(--olive)}
.s-virtue .mission{position:absolute;left:130px;top:770px;background:var(--sand);border-radius:28px;padding:28px 40px;display:flex;flex-direction:column;gap:12px;max-width:1000px}
.s-virtue .mission i{font-style:normal;font:400 32px/1 var(--f-display);color:var(--olive)}
.s-virtue .mission span{font:400 64px/1.15 var(--f-display)}
.s-virtue .photo{right:50px;height:560px;max-width:780px}

/* 5+. 운동 슬라이드 */
.s-act .kicker{position:absolute;left:110px;top:150px;display:flex;gap:14px;align-items:center}
.s-act h2{position:absolute;left:104px;top:230px;margin:0;font:400 170px/1 var(--f-display);max-width:1150px;text-wrap:balance;z-index:2}
.s-act h2.long{font-size:130px}
.s-act .sub{position:absolute;left:112px;top:430px;font:700 46px/1.3 var(--f-body);color:var(--olive);max-width:1100px;z-index:2}
.s-act .how{position:absolute;left:110px;top:520px;width:1080px;display:flex;flex-direction:column;gap:12px;z-index:2}
.s-act .how li{list-style:none;background:var(--paper);border-radius:22px;padding:16px 28px;font:700 36px/1.35 var(--f-body);display:grid;grid-template-columns:54px 1fr;gap:18px;align-items:start;animation:rise .5s both;box-shadow:0 8px 0 rgba(90,70,50,.08)}
.s-act .how li:nth-child(2){animation-delay:.1s}.s-act .how li:nth-child(3){animation-delay:.2s}.s-act .how li:nth-child(4){animation-delay:.3s}
.s-act .how b{width:54px;height:54px;border-radius:50%;background:var(--taupe);color:#fff;display:grid;place-items:center;font:400 30px/1 var(--f-display)}
.s-act .poom{position:absolute;left:110px;top:470px;display:flex;flex-direction:column;gap:24px;z-index:2}
.s-act .poom div{background:var(--paper);border-radius:28px;padding:34px 46px;font:400 110px/1 var(--f-display);display:flex;align-items:center;gap:34px;box-shadow:0 8px 0 rgba(90,70,50,.08)}
.s-act .poom em{font-style:normal;font:700 40px/1 var(--f-body);color:#fff;background:var(--taupe);border-radius:14px;padding:14px 20px}
.s-act .cue{position:absolute;left:110px;bottom:50px;display:flex;gap:16px;align-items:center;z-index:3}
.s-act .cue span{font:700 26px/1.3 var(--f-body);color:var(--muted)}
.s-act .halo{position:absolute;right:110px;bottom:-140px;width:760px;height:760px;border-radius:50%;background:#f3ece3}
.s-act.warm{background:#efe5d6}

/* 마무리 */
.s-end{background:var(--taupe)}
.s-end .msg{position:absolute;left:110px;top:150px;font:400 92px/1.25 var(--f-display);color:#fff;max-width:1150px}
.s-end .msg b{color:var(--ink);font-weight:400}
.s-end .shout{position:absolute;left:110px;top:520px;font:400 150px/1 var(--f-display);color:var(--ink)}
.s-end .shout span{color:#fff}
.s-end .next{position:absolute;left:110px;bottom:80px;background:var(--paper);border-radius:28px;padding:28px 40px;max-width:1080px;display:flex;flex-direction:column;gap:10px}
.s-end .next i{font-style:normal;font:700 28px/1 var(--f-body);color:var(--olive);letter-spacing:.08em}
.s-end .next span{font:400 46px/1.25 var(--f-display)}
.s-end .photo{height:860px;right:40px;bottom:0}

/* 휴관·행사 */
.s-special .wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 820px;align-items:center;padding:0 110px;gap:40px}
.s-special .left{display:flex;flex-direction:column;gap:28px;align-items:flex-start}
.s-special .bigdate{font:400 120px/1 var(--f-display);color:var(--muted)}
.s-special h2{margin:0;font:400 150px/1.02 var(--f-display);text-wrap:balance}
.s-special p{margin:0;font:700 42px/1.45 var(--f-body);color:var(--muted);max-width:28ch}
.s-special .art{justify-self:center;max-height:820px;max-width:780px;animation:pop .7s both}
.s-special .art.card{border-radius:40px;box-shadow:0 18px 40px rgba(60,40,20,.25)}
.s-special.holiday h2{color:var(--red)} .s-special.event h2{color:var(--blue)}

/* 한 달 보기 */
.s-month .head{position:absolute;left:90px;top:60px;font:400 84px/1 var(--f-display)}
.s-month .head span{color:var(--muted);font-size:44px;margin-left:16px}
.grid{position:absolute;left:90px;right:90px;top:180px;bottom:60px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:52px;grid-auto-rows:1fr;gap:10px}
.gh{font:700 26px/1 var(--f-body);color:#fff;background:var(--taupe);display:grid;place-items:center;border-radius:12px}
.gc{background:var(--paper);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit}
.gc:hover{box-shadow:inset 0 0 0 3px var(--taupe)}
.gc.today{box-shadow:inset 0 0 0 5px var(--olive)}
.gc .n{font:400 34px/1 var(--f-display)} .gc .s{font:500 19px/1.3 var(--f-body);color:var(--muted)}
.gc.hol .n{color:var(--red)} .gc.sat .n,.gc.evt .s{color:var(--blue)}
.gc.blank{background:transparent;cursor:default}
.gc.theme{background:var(--sand);flex-direction:row;align-items:center;gap:24px;cursor:default}
.gc.theme .bw{font:400 90px/1 var(--f-brush)}

/* controls */
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:#2a241f;color:#efe6db;display:flex;align-items:center;gap:8px;font:500 15px/1 var(--f-body)}
#bar button,#bar select{background:#40382f;color:#f5ede3;border:0;border-radius:10px;height:40px;padding:0 12px;font:700 15px/1 var(--f-body);cursor:pointer;white-space:nowrap}
#bar button:hover{background:#544a3f}
#bar button:focus-visible,#bar select:focus-visible,#bar input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#bar .on{background:var(--olive)!important}
#bar .sep{width:1px;height:28px;background:#4d443a;margin:0 4px}
#pos{min-width:150px;text-align:center;font-variant-numeric:tabular-nums;color:#e9dfd3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#track{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#cbbfb1}
#vol{width:90px;accent-color:#9fb37f}
@media (max-width:900px){#track,#vol,.hide-s{display:none}#pos{min-width:0;flex:1}}

#start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(42,36,31,.72);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#start .card{background:var(--paper);border-radius:24px;padding:32px 36px;max-width:480px;text-align:center;display:flex;flex-direction:column;gap:14px}
#start h1{margin:0;font:400 40px/1.15 var(--f-display)}
#start p{margin:0;font:500 17px/1.6 var(--f-body);color:var(--muted)}
#start .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#start .btn{font-size:20px;padding:16px 26px}
#start .ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--taupe)}

/* 영상 버튼·플레이어 */
.s-act .acts2{position:absolute;left:110px;bottom:40px;right:860px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;z-index:3}
.vbtn{font:700 26px/1 var(--f-body);border:0;border-radius:999px;padding:16px 24px;background:var(--ink);color:#fff;cursor:pointer;display:inline-flex;gap:10px;align-items:center}
.vbtn::before{content:"";width:0;height:0;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.vbtn:focus-visible{outline:4px solid var(--gold);outline-offset:4px}
.acts2 .btn{font-size:26px;padding:16px 24px}
#vp{position:absolute;inset:0;z-index:30;background:rgba(20,17,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#vp video{width:1520px;height:855px;background:#000;border-radius:18px}
#vp .vhead{width:1520px;display:flex;justify-content:space-between;align-items:center;color:#fff}
#vp .vt{font:400 56px/1 var(--f-display)}
#vp .vpart{font:700 28px/1 var(--f-body);color:#cbbfb1;margin-left:20px}
#vp .vclose{font:700 30px/1 var(--f-body);background:#fff;color:var(--ink);border:0;border-radius:999px;padding:18px 30px;cursor:pointer}

/* 전달사항 */
.s-notice{background:var(--paper)}
.s-notice .nh{position:absolute;left:110px;top:90px;display:flex;align-items:baseline;gap:30px}
.s-notice .nh h2{margin:0;font:400 120px/1 var(--f-display)}
.s-notice .nh span{font:700 40px/1 var(--f-body);color:var(--muted)}
.s-notice .poster{position:absolute;right:110px;top:200px;height:820px;aspect-ratio:1055/1491;padding:0;border:0;border-radius:24px;overflow:hidden;cursor:zoom-in;box-shadow:0 18px 40px rgba(0,0,0,.18);background:#fff}
.s-notice .plink{position:absolute;right:110px;top:950px;width:509px;box-sizing:border-box;text-align:center;font:700 30px/1 var(--f-body);background:var(--ink);color:#fff;border-radius:999px;padding:20px 0;text-decoration:none}
.s-notice .plink:focus-visible{outline:4px solid var(--gold);outline-offset:4px}
.s-notice .poster:has(+.plink){height:720px}
.s-notice .poster img{width:100%;height:100%;object-fit:cover;display:block}
.s-notice .poster span{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font:700 24px/1 var(--f-body);background:rgba(42,36,31,.82);color:#fff;border-radius:999px;padding:12px 20px;white-space:nowrap}
.s-notice:has(.poster) .pin{right:810px}
.s-notice .board.withposter{right:770px}
.s-notice .board.withposter .ntext{font-size:50px}
.s-notice .board{position:absolute;left:110px;right:110px;top:260px;bottom:90px;border-radius:32px;background:var(--sand);padding:46px 60px;
  background-image:repeating-linear-gradient(transparent 0 87px, rgba(125,112,100,.22) 87px 89px);background-origin:content-box}
.s-notice .ntext{font:700 58px/89px var(--f-body);white-space:pre-wrap;min-height:89px;color:var(--ink);overflow:hidden;height:100%}
.s-notice .ntext:empty::before{content:attr(data-ph);color:var(--muted);font-weight:500}
.s-notice .pin{position:absolute;right:150px;top:226px;width:70px;height:70px;border-radius:50%;background:var(--red);box-shadow:0 8px 0 rgba(0,0,0,.15)}

/* 수정 모드 */
body.editing [data-k]{outline:4px dashed var(--gold);outline-offset:8px;border-radius:6px;cursor:text}
body.editing [data-k]:focus{outline-style:solid;background:rgba(255,255,255,.55)}
body.editing .s-med [data-k]:focus{background:rgba(0,0,0,.25)}
.how li.empty{display:none}
body.editing .how li.empty{display:grid;opacity:.6}
body.editing .how li.empty span:empty::before{content:"(설명 추가)";color:var(--muted)}
#savest{font:700 13px/1 var(--f-body);color:#cbbfb1;white-space:nowrap}
#savest.err{color:#ff9b8f}
#edit.on{background:var(--gold)!important;color:var(--ink)!important}

/* 편집 패널 */
#drawer{position:fixed;top:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(560px,100vw);z-index:15;background:var(--paper);color:var(--ink);
  box-shadow:-10px 0 30px rgba(0,0,0,.3);display:flex;flex-direction:column;font:500 15px/1.4 var(--f-body);
  padding-right:env(safe-area-inset-right,0px)}
#drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #e2d8cc;gap:10px}
#drawer h3{margin:0;font:400 24px/1.1 var(--f-display)}
#drawer .body{overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
#drawer .sec{font:700 13px/1 var(--f-body);letter-spacing:.08em;color:var(--olive);margin-top:6px}
#drawer .hint{color:var(--muted);font-size:13px;margin:0}
.it{border:1px solid #e2d8cc;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fff}
.it .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it select,.it input[type=text],#drawer textarea{font:500 15px/1.3 var(--f-body);border:1px solid #d6cabd;border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink);min-width:0}
.it input[type=text]{flex:1}
.it .mini{border:0;background:var(--sand);border-radius:8px;width:36px;height:36px;cursor:pointer;font:700 15px/1 var(--f-body);color:var(--ink)}
.it .mini.del{background:#f6dcd9;color:var(--red)}
.it details summary{cursor:pointer;color:var(--olive);font-weight:700}
.it .vlist{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px}
.it .vlist label{display:flex;gap:6px;align-items:center;font-size:14px}
#drawer textarea{width:100%;box-sizing:border-box;min-height:140px;resize:vertical}
#drawer .dbtn{font:700 15px/1 var(--f-body);border:0;border-radius:10px;padding:12px 14px;background:var(--olive);color:#fff;cursor:pointer}
#drawer .dbtn.ghost{background:var(--sand);color:var(--ink)}
#drawer .dbtn.warn{background:#f6dcd9;color:var(--red)}
#drawer button:focus-visible,#drawer input:focus-visible,#drawer select:focus-visible,#drawer textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

[data-k]{white-space:pre-line}
.s-notice .ntext{white-space:pre-wrap}

body.locked #grp, body.locked #dprev, body.locked #dsel, body.locked #dnext, body.locked #share{display:none!important}

function strToItem(raw){
  if(raw==="품새") return {g:"품새", n:"이달의 품새"};
  if(raw==="기술발차기") return {g:"기술발차기", n:"기술발차기"};
  if(raw==="명상"||raw==="인성교육") return {g:raw, n:raw};
  const [k,v]=raw.split(":"); return {g:k, n:v||k};
}
function defaultItems(d){ const e=PLAN.days[d]; const arr=Array.isArray(e)?e:(e&&e.items)||[]; return arr.map(strToItem); }

function textFor(d,k,def){ const s=STORE[d]; return (s&&s.texts&&typeof s.texts[k]==="string") ? s.texts[k] : def; }
function itemField(it,f,j){
  const a=ACT[it.n]||{};
  if(f==="sub") return typeof it.sub==="string" ? it.sub : (a.sub||"");
  if(f==="how"){ const h=Array.isArray(it.how)?it.how:(a.how||[]); return h[j]||""; }

  if(f==="hi") return typeof it.hi==="string" ? it.hi : PLAN.poomsae.hi;

}

function vbtn(key,label,yt){

function buildMonth(){
  let cells=["월","화","수","목","금","토"].map(h=>`<div class="gh">${h}</div>`).join("");
  const lead=(firstDow+6)%7;
  if(lead>=2) cells+=`<div class="gc theme" style="grid-column:span ${lead}"><span class="bw">${esc(PLAN.virtue.word)}</span><span class="s">${esc(PLAN.virtue.def)}</span></div>`;
  else for(let i=0;i<lead;i++) cells+=`<div class="gc blank"></div>`;
  for(let d=1; d<=lastDay; d++){
    const dow=dateOf(d).getDay(); if(dow===0) continue;
    const e=PLAN.days[d]; let s="", cls="";
    if(!e){ s=""; }
    else if(e.holiday){s=e.holiday;cls="hol";}
    else if(e.sat){s=e.sat.replace(/\n/g," ");cls="evt";}
    else {s=itemsFor(d).map(i=>i.n).join(" · "); if(e.event){s+=" · "+e.event;cls="evt";}}
    if(STORE[d]&&STORE[d].notice) s+=" · 📌전달사항";
    if(dow===6&&!(e&&e.holiday)) cls+=" sat";
    cells+=`<button class="gc ${cls}" data-day="${d}"><span class="n">${d}</span><span class="s">${esc(s)}</span></button>`;
  }
  return [{sid:"month", label:"한 달 보기", music:"bgm", cls:"s-month", html:`<div class="head">${M}월 ${PLAN.group} 수련계획<span>날짜를 누르면 그날 수업 PPT가 열려요</span></div><div class="grid">${cells}</div>`}];
}

const stage=document.getElementById("stage"), dsel=document.getElementById("dsel");

let deck=[], cur=0, curDay=null, editing=false;
function render(keepSid){
  deck = curDay==="month" ? buildMonth() : buildDeck(curDay);
  stage.innerHTML=deck.map((s,i)=>`<section class="slide ${s.cls}" data-sid="${s.sid}" aria-label="${esc(s.label)}"><div class="step">${deck.length>1?`${i+1} / ${deck.length}`:""}</div>${s.html}</section>`).join("");
  applyEditable();
  let i=0; if(keepSid){ const k=deck.findIndex(s=>s.sid===keepSid); i = k>=0?k:Math.min(cur,deck.length-1); }
  cur=-1; show(i, true);
  if(curDay==="month") markToday();
  if(!document.getElementById("drawer").hidden) renderDrawer();
}

  curDay=d; dsel.value=String(d);
  render(); if(slideIndex) show(slideIndex);
  if(!LOCK){ try{history.replaceState(null,"","#"+HP+(d==="month"?"month":"d"+d))}catch(e){} }
}
function show(i, quiet){
  const els=stage.querySelectorAll(".slide");
  i=Math.max(0,Math.min(deck.length-1,i));
  if(cur>=0&&els[cur]) els[cur].classList.remove("on");
  if(i!==cur) played.clear();
  cur=i; els[cur].classList.add("on");
  els.forEach((el,j)=>el.setAttribute("aria-hidden",j===cur?"false":"true"));
  document.getElementById("pos").textContent=`${cur+1}/${deck.length} · ${deck[cur].label}`;
  if(!quiet){ closeVideo(); stopCue(false); }
  syncMusic();
}
/* 한 버튼 진행: 영상이 열려 있으면 닫고, 종목 장에서는 첫 영상을 먼저 틀고, 그다음 누르면 다음 장 */
const played=new Set();
function slideVideos(){ const el=stage.querySelectorAll(".slide")[cur]; return el&&el.classList.contains("s-act") ? [...el.querySelectorAll("[data-video]")] : []; }
function playNth(n){ const b=slideVideos()[n]; if(!b) return false; played.add(n); openVideo(b.dataset.video); return true; }
function stepNext(){
  if(vpOpen){ closeVideo(); return; }
  if(!editing && played.size===0 && playNth(0)) return;   // 첫 영상만 자동, 나머지는 숫자키
  stepNextSlide();
}
function stepNextSlide(){ if(cur<deck.length-1) show(cur+1); else if(!LOCK){ const k=dayList.indexOf(curDay); if(k>=0&&k<dayList.length-1) openDay(dayList[k+1]); } }
function stepPrev(){ if(vpOpen){ closeVideo(); return; } if(cur>0) show(cur-1); else if(!LOCK){ const k=dayList.indexOf(curDay); if(k>0) openDay(dayList[k-1], 99); } }
function todayDay(){
  const now=new Date();
  if(now.getFullYear()!==PLAN.year||now.getMonth()+1!==PLAN.month) return dayList[0];
  return dayList.find(x=>x>=now.getDate()) || "month";
}
function markToday(){
  const now=new Date();
  stage.querySelectorAll(".gc[data-day]").forEach(b=>b.classList.toggle("today",now.getFullYear()===PLAN.year&&now.getMonth()+1===PLAN.month&&+b.dataset.day===now.getDate()));
}
function fit(){

  stage.style.transform=`translate(-50%,-50%) scale(${Math.min(vp.clientWidth/1920, vp.clientHeight/1080)})`;
}

document.getElementById("next").onclick=stepNext;
dsel.onchange=()=>openDay(dsel.value==="month"?"month":+dsel.value);
document.getElementById("dprev").onclick=()=>{const k=dayList.indexOf(curDay); openDay(curDay==="month"?dayList[dayList.length-1]:dayList[Math.max(0,k-1)]);};
document.getElementById("dnext").onclick=()=>{const k=dayList.indexOf(curDay); openDay(curDay==="month"||k===dayList.length-1?"month":dayList[k+1]);};
stage.addEventListener("click",ev=>{
  const yl=ev.target.closest("[data-ytlink]"); if(yl){ stopCue(false); bgm.pause(); trackEl.textContent="▶ 유튜브 새 창에서 재생 중 · 돌아오면 ♪ 음악을 눌러 주세요"; return; }
  const sw=ev.target.closest("[data-sw]"); if(sw){ swClick(sw); return; }

addEventListener("keydown",ev=>{
  if(ev.target.closest("input,select,textarea,[contenteditable='true'],[contenteditable='plaintext-only'],#drawer")) return;
  if(vpOpen && ev.key==="Escape"){ closeVideo(); return; }
  if(["ArrowRight","PageDown"," "].includes(ev.key)){ev.preventDefault();stepNext();}
  else if(["ArrowLeft","PageUp"].includes(ev.key)){ev.preventDefault();stepPrev();}
  else if(ev.key==="Home") show(0);
  else if(ev.key==="F5"){ ev.preventDefault(); toggleFs(); }
  else if(["b","B",".",","].includes(ev.key)){ ev.preventDefault(); if(vpOpen) closeVideo(); else playNth(Math.max(0,slideVideos().findIndex((b,j)=>!played.has(j)))); }
  else if(/^[1-9]$/.test(ev.key) && !editing){ if(vpOpen) closeVideo(); playNth(+ev.key-1); }
  else if(ev.key==="f"||ev.key==="F") toggleFs();
  else if(ev.key==="m"||ev.key==="M") toggleMusic();
});
let tx=null;

addEventListener("touchend",e=>{if(tx==null||editing)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)(dx<0?stepNext:stepPrev)();tx=null},{passive:true});
function toggleFs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} }

/* ===== 음악 ===== */
const bgm=document.getElementById("bgm"), cue=document.getElementById("cue");
const playBtn=document.getElementById("play"), trackEl=document.getElementById("track"), vol=document.getElementById("vol");
let musicOn=false, ti=Math.floor(Math.random()*TRACKS.length), nowKind=null;
try{const v=localStorage.getItem("poom-vol"); if(v!==null) vol.value=v;}catch(e){}
bgm.volume=+vol.value; cue.volume=Math.min(1,+vol.value+0.3);
vol.oninput=()=>{bgm.volume=+vol.value; cue.volume=Math.min(1,+vol.value+0.3); try{localStorage.setItem("poom-vol",vol.value)}catch(e){}};
let ci=0;
function setSrc(kind){ const t = kind==="med" ? MED : kind==="club" ? CLUB[ci] : TRACKS[ti]; nowKind=kind; bgm.src=t.src; trackEl.textContent="♪ "+t.name; }
function playBgm(){ bgm.play().then(()=>{playBtn.classList.add("on")}).catch(()=>{trackEl.textContent="♪ 음악 버튼을 한 번 더 눌러 주세요"}); }
function syncMusic(){
  if(!musicOn || !cue.paused || vpOpen) return;
  const want=(deck[cur]&&deck[cur].music)||"bgm";
  if(want!==nowKind || !bgm.src){ setSrc(want); playBgm(); }
  else if(bgm.paused) playBgm();
}
function toggleMusic(){
  musicOn=!musicOn;
  if(musicOn){ playBtn.classList.add("on"); syncMusic(); }
  else { bgm.pause(); playBtn.classList.remove("on"); trackEl.textContent="음악 꺼짐"; }
}
bgm.addEventListener("ended",()=>{ if(nowKind==="bgm") ti=(ti+1)%TRACKS.length; if(nowKind==="club") ci=(ci+1)%CLUB.length; setSrc(nowKind); playBgm(); });
playBtn.onclick=toggleMusic;
document.getElementById("skip").onclick=()=>{ const k=nowKind==="club"?"club":"bgm"; if(k==="club") ci=(ci+1)%CLUB.length; else ti=(ti+1)%TRACKS.length; musicOn=true; playBtn.classList.add("on"); setSrc(k); playBgm(); };

let cueBtn=null;
function toggleCue(key,btn){
  if(cueBtn===btn && !cue.paused){ stopCue(true); return; }
  stopCue(false);
  cue.src=CUES[key].src; bgm.pause(); cueBtn=btn;
  cue.play().then(()=>{ btn.classList.add("playing"); btn.dataset.label=btn.textContent; btn.textContent="■ 멈추기"; trackEl.textContent="▶ "+CUES[key].label; })
           .catch(()=>{ trackEl.textContent="재생 버튼을 한 번 더 눌러 주세요"; });
}
function stopCue(resume){
  if(cueBtn){ cueBtn.classList.remove("playing"); if(cueBtn.dataset.label) cueBtn.textContent=cueBtn.dataset.label; }
  cueBtn=null; if(!cue.paused) cue.pause();
  if(resume) syncMusic();
}
cue.addEventListener("ended",()=>stopCue(true));

/* ===== 영상 커리큘럼 플레이어 ===== */
let vpOpen=false;
function openVideo(key){
  let v, yt=null;
  if(key.startsWith("yt:")){ const [,id,...t]=key.split(":"); yt=id; v={label:t.join(":")||"영상"}; }
  else { v=VIDEOS[key]; if(!v) return; yt=v.yt||null; }
  closeVideo(); stopCue(false); bgm.pause(); vpOpen=true;
  const slide=stage.querySelectorAll(".slide")[cur];
  const box=document.createElement("div"); box.id="vp";
  box.innerHTML=`<div class="vhead"><div><span class="vt">${esc(v.label)}</span><span class="vpart"></span></div><button class="vclose" data-vclose>✕ 닫기</button></div>`+
    (yt ? `<iframe width="1520" height="855" style="border:0;border-radius:18px;background:#000" src="https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&rel=0&playsinline=1&enablejsapi=1" title="${esc(v.label)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`
        : `<video controls playsinline></video>`);
  slide.appendChild(box);
  trackEl.textContent="▶ 영상 · "+v.label;
  if(yt) return;
  const el=box.querySelector("video"), partEl=box.querySelector(".vpart");
  let p=0;
  const load=()=>{ el.src=`video/v_${key}_${String(p).padStart(3,"0")}.mp4`; partEl.textContent=v.parts>1?`${p+1} / ${v.parts}`:""; el.play().catch(()=>{}); };
  el.addEventListener("ended",()=>{ if(p<v.parts-1){ p++; load(); } else closeVideo(); });
  load();
}
/* 유튜브가 끝나면 자동으로 닫기 + 리모컨 키가 계속 먹히도록 포커스 되찾기 */
addEventListener("message",e=>{ if(!/youtube/.test(e.origin||"")) return; let j; try{ j=typeof e.data==="string"?JSON.parse(e.data):e.data; }catch(x){ return; }
  if(j && j.info && j.info.playerState===0 && vpOpen) closeVideo(); });
document.addEventListener("load",e=>{ const f=e.target; if(f && f.tagName==="IFRAME" && /youtube/.test(f.src)){ try{ f.contentWindow.postMessage(JSON.stringify({event:"listening",id:1,channel:"widget"}),"*"); }catch(x){} } },true);
addEventListener("blur",()=>setTimeout(()=>{ const a=document.activeElement; if(a && a.tagName==="IFRAME"){ a.blur(); window.focus(); } },0));
/* 왕중왕전 스톱워치 */
let swT0=0, swAcc=0, swRun=null;
function swShow(){ const ms=swAcc+(swRun?Date.now()-swT0:0), t=Math.floor(ms/1000); stage.querySelectorAll("[data-swt]").forEach(el=>el.textContent=`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`); stage.querySelectorAll('[data-sw="go"]').forEach(b=>b.textContent=swRun?"■ 멈춤":(swAcc?"▶ 계속":"▶ 시작")); }
function swClick(b){
  const go=stage.querySelector('.slide.on [data-sw="go"]');
  if(b.dataset.sw==="go"){
    if(swRun){ swAcc+=Date.now()-swT0; clearInterval(swRun); swRun=null; go.textContent="▶ 계속"; }
    else { swT0=Date.now(); swRun=setInterval(swShow,250); go.textContent="■ 멈춤"; if(!musicOn){ musicOn=true; playBtn.classList.add("on"); } syncMusic(); }
  } else { clearInterval(swRun); swRun=null; swAcc=0; if(go) go.textContent="▶ 시작"; }
  swShow();
}
function openImage(src,title){
  closeVideo(); vpOpen=true;
  const slide=stage.querySelectorAll(".slide")[cur];
  const box=document.createElement("div"); box.id="vp";
  box.innerHTML=`<div class="vhead"><div><span class="vt">${esc(title)}</span></div><button class="vclose" data-vclose>✕ 닫기</button></div><img src="${esc(src)}" alt="${esc(title)}" style="max-height:860px;max-width:1520px;background:#fff;border-radius:12px">`;
  slide.appendChild(box);
}
function closeVideo(){
  const box=document.getElementById("vp"); if(!box){ vpOpen=false; return; }
  const el=box.querySelector("video"); if(el){ try{el.pause(); el.removeAttribute("src"); el.load();}catch(e){} }
  box.remove(); vpOpen=false; syncMusic();
}

/* ===== 수정하기 ===== */
const editBtn=document.getElementById("edit"), itemsBtn=document.getElementById("items"), savest=document.getElementById("savest");
function applyEditable(){
  stage.querySelectorAll("[data-k]").forEach(el=>{
    if(editing){ el.setAttribute("contenteditable","true"); el.setAttribute("spellcheck","false"); }
    else el.removeAttribute("contenteditable");
  });
}
editBtn.onclick=()=>{
  if(EMBED && API_URL && !editing && !getPin()){ askPin(); return; }
  editing=!editing; document.body.classList.toggle("editing",editing);
  editBtn.classList.toggle("on",editing); editBtn.textContent=editing?"✓ 수정 끝":"✏ 수정";

stage.addEventListener("paste",ev=>{ if(!ev.target.closest("[data-k]")) return; ev.preventDefault(); const t=(ev.clipboardData||window.clipboardData).getData("text"); document.execCommand("insertText",false,t); });
stage.addEventListener("keydown",ev=>{ const el=ev.target.closest("[data-k]"); if(!el) return; if(ev.key==="Escape") el.blur(); if(ev.key==="Enter" && el.dataset.k!=="notice" && !/msg|med\.p/.test(el.dataset.k)){ ev.preventDefault(); el.blur(); } });
stage.addEventListener("focusout",ev=>{
  const el=ev.target.closest&&ev.target.closest("[data-k]"); if(!el||!editing||curDay==="month") return;
  const k=el.dataset.k, val=el.innerText.replace(/\u00a0/g," ").replace(/\n{3,}/g,"\n\n").trim();
  const d=curDay, s=st(d);
  if(k==="notice"){ if((s.notice||"")===val) return; s.notice=val; }
  else if(k.startsWith("item:")){
    const [,idx,f,j]=k.split(":"); const items=s.items?s.items:(s.items=clone(defaultItems(d)));
    const it=items[+idx]; if(!it) return;
    if(f==="how"){ const a=ACT[it.n]||{}; const h=Array.isArray(it.how)?it.how.slice():(a.how||[]).slice(); while(h.length<4)h.push(""); if(h[+j]===val) return; h[+j]=val; it.how=h; }
    else if(f==="n"){ if(!val||it.n===val) return; const a=ACT[it.n]||{}; if(it.sub==null) it.sub=a.sub||""; if(!it.how) it.how=(a.how||[]).slice(); if(!it.v) it.v=videosOf(it); it.n=val; }
    else { if(itemField(it,f)===val) return; it[f]=val; }
  } else {
    s.texts=s.texts||{}; if(s.texts[k]===val) return; s.texts[k]=val;
  }
  queueSave(d);
});

/* 저장: 하루 문서 하나씩, 한 번에 한 번만 */
const timers={}, chains={};
function setStatus(t,err){ savest.textContent=t; savest.classList.toggle("err",!!err); }
function queueSave(d){
  setStatus("저장 중…");
  clearTimeout(timers[d]);
  timers[d]=setTimeout(()=>{
    const body=clone(st(d)); body.updated=Date.now();
    chains[d]=(chains[d]||Promise.resolve()).then(async()=>{
      if(EMBED && API_URL){ await postDay(d); return; }
      if(localOnly||!db){ try{ const all=JSON.parse(localStorage.getItem("poom-days")||"{}"); all[d]=body; localStorage.setItem("poom-days",JSON.stringify(all)); setStatus("이 기기에 저장됨"); }catch(e){ setStatus("저장 실패",true); } return; }
      try{ await db.doc("days/d"+d).set(body); setStatus("저장됨 ✓"); }
      catch(e){
        if(e&&e.code==="invalid_argument"){ canWrite=false; setStatus("수정 권한이 없어요",true); editBtn.hidden=true; if(editing) editBtn.click(); }
        else if(e&&e.code==="quota_exceeded") setStatus("저장 공간이 가득 찼어요",true);
        else setStatus("저장 실패 · 다시 시도해 주세요",true);
      }
    });
  },450);
}

/* 종목·영상 편집 패널 */
const drawer=document.getElementById("drawer"), dbody=document.getElementById("dbody");
itemsBtn.onclick=()=>{ drawer.hidden=!drawer.hidden; if(!drawer.hidden) renderDrawer(); };
document.getElementById("dclose").onclick=()=>{ drawer.hidden=true; };
function renderDrawer(){

          <button class="mini" data-act="up" aria-label="위로">↑</button><button class="mini" data-act="down" aria-label="아래로">↓</button><button class="mini del" data-act="del" aria-label="삭제">✕</button></div>

          <div class="vlist">${Object.entries(VIDEOS).map(([id,v])=>`<label><input type="checkbox" data-v="${id}" ${vids.includes(id)?"checked":""}>${esc(v.label)}</label>`).join("")}</div>

          <div class="row"><input type="text" data-yt placeholder="유튜브 링크 붙여넣기" aria-label="유튜브 링크"><input type="text" data-ytt placeholder="버튼 이름" aria-label="버튼 이름" style="max-width:130px"><button class="dbtn" data-act="addyt">추가</button></div>

  h+=`<div class="sec">되돌리기</div><div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="dbtn warn" data-act="reset">이 날 수정한 내용 모두 지우기</button><span id="rconfirm"></span></div>`;
  dbody.innerHTML=h;
}
function mutateItems(fn){ const d=curDay, s=st(d); s.items = s.items ? s.items : clone(defaultItems(d)); fn(s.items); queueSave(d); render(deck[cur]&&deck[cur].sid); }
dbody.addEventListener("change",ev=>{
  const row=ev.target.closest(".it"); const t=ev.target;
  if(t.id==="ntext") return;
  if(!row) return; const i=+row.dataset.i;
  if(t.dataset.f==="g") mutateItems(a=>{ a[i].g=t.value; if(t.value==="품새"&&!a[i].n) a[i].n="이달의 품새"; });
  else if(t.dataset.f==="n") mutateItems(a=>{ const it=a[i]; const old=ACT[it.n]||{}; if(it.v==null) it.v=videosOf(it); if(!ACT[t.value]){ if(it.sub==null) it.sub=old.sub||""; if(!it.how) it.how=(old.how||[]).slice(); } it.n=t.value.trim()||it.n; });
  else if(t.dataset.v) mutateItems(a=>{ const it=a[i]; const cur2=videosOf(it).slice(); const k=cur2.indexOf(t.dataset.v); if(t.checked&&k<0) cur2.push(t.dataset.v); if(!t.checked&&k>=0) cur2.splice(k,1); it.v=cur2; });
});
dbody.addEventListener("input",ev=>{ if(ev.target.id!=="ntext") return; const d=curDay; st(d).notice=ev.target.value; queueSave(d);
  const n=stage.querySelector('[data-k="notice"]'); if(n) n.textContent=ev.target.value; });
dbody.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, row=b.closest(".it"), i=row?+row.dataset.i:-1;
  if(act==="up"&&i>0) mutateItems(a=>{ [a[i-1],a[i]]=[a[i],a[i-1]]; });
  else if(act==="down") mutateItems(a=>{ if(i<a.length-1) [a[i+1],a[i]]=[a[i],a[i+1]]; });
  else if(act==="del") mutateItems(a=>{ a.splice(i,1); });
  else if(act==="addyt"){ const id=ytIdOf(row.querySelector("[data-yt]").value), t=row.querySelector("[data-ytt]").value.trim()||"영상";
    if(!id){ row.querySelector("[data-ytmsg]").textContent="유튜브 링크를 확인해 주세요 (youtu.be/… 또는 youtube.com/watch?v=…)"; return; }
    mutateItems(a=>{ a[i].ytx=(a[i].ytx||[]).concat([{id,t}]); }); }
  else if(act==="delyt") mutateItems(a=>{ (a[i].ytx||[]).splice(+b.dataset.k,1); });
  else if(act==="add") mutateItems(a=>{ a.push({g:"기타", n:"새 종목", sub:"", how:["","",""], v:[]}); });
  else if(act==="reset"){ document.getElementById("rconfirm").innerHTML=`<button class="dbtn warn" data-act="reset2">정말 지우기</button> <button class="dbtn ghost" data-act="cancel">취소</button>`; }
  else if(act==="cancel"){ document.getElementById("rconfirm").innerHTML=""; }
  else if(act==="reset2"){ const d=curDay; STORE[d]={}; queueSave(d); render(deck[cur]&&deck[cur].sid); }
});

/* ===== 시작 ===== */
const h=RAWH.replace(/^yu-?/,"");
/* 공유 전용 링크: #today = 매일 그날 수업만, #only-d14 = 14일 수업만 (날짜 이동·수정 숨김) */

const startDay = LOCK==="today" ? (todayDay()==="month"?dayList[dayList.length-1]:todayDay()) : LOCK==="day" ? +h.slice(6) :
  (h==="month" ? "month" : (/^d\d+$/.test(h) && PLAN.days[+h.slice(1)] ? +h.slice(1) : todayDay()));
if(LOCK){ document.body.classList.add("locked"); }
try{ const all=JSON.parse(localStorage.getItem("poom-days")||"{}"); }catch(e){}
openDay(startDay);
if(startDay!=="month") document.getElementById("startTitle").innerHTML=`${M}월 ${startDay}일 수업을<br>시작할까요?`;

document.getElementById("quiet").onclick=()=>begin(false);
try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{});}catch(e){}


/* ===== 초등부 ↔ 유치부 ===== */

grpBtn.textContent = GROUP==="yu" ? "🔁 초등부 보기" : "🔁 유치부 보기";
grpBtn.onclick=()=>{ const c = curDay==="month" ? "month" : "d"+curDay; location.hash="#"+(GROUP==="yu"?"":"yu-")+c; location.reload(); };
/* ===== 오늘만 공유 ===== */
const SHARE_BASE = EMBED ? (location.origin+location.pathname) : "https://claude.ai/artifact/ChbmzXnNccXC4S5CbEfVA5";
const sharebox=document.getElementById("sharebox"), sbody=document.getElementById("sbody");
function shareRow(title,desc,url,id){ return `<div class="it"><b>${esc(title)}</b><p class="hint">${esc(desc)}</p>

    + shareRow("매일 바뀌는 '오늘 수업' 링크", "한 번 저장해 두면 열 때마다 그날 수업만 보여 줘요. 도장 TV 즐겨찾기에 좋아요.", `${SHARE_BASE}#${HP}today`, "l2")
    + `<p class="hint">링크를 받은 사람이 주소 끝(#…)을 지우면 전체 달력도 볼 수 있어요. 완전히 따로 떼어 내야 하면 말씀해 주세요.</p>`;

/* ===== 구글 시트 연결 (홈페이지용): 시트의 종목·전달사항을 읽어 모든 기기에 같은 내용 표시 ===== */
const SHEET_ID="1e6EsqgdsWtzTxOalNjiDsZuM3TDBd09HP1w05Cf6V7Y";
/* Apps Script 웹 앱 주소 (시트 읽기·쓰기). 비어 있으면 공개 시트를 읽기만 합니다 */
const TAB = GROUP==="yu" ? "유치부" : "";
let tabMissing=false;
const API_URL="https://script.google.com/macros/s/AKfycbxTFX_Vj8AKhtBHvbFYSBAaAp1BBEw2ecJWVdA76Mxv0hYBokXT0KuCr8xlvATMiFl0/exec";
const SHEET_EDIT=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
const NAME2G={"이달의 품새":"품새","기술발차기":"기술발차기"};
Object.values(PLAN.days).forEach(e=>{ const a=Array.isArray(e)?e:(e&&e.items)||[]; a.forEach(r=>{ const it=strToItem(r); NAME2G[it.n]=it.g; }); });
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c; }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function nameToItem(raw){
  raw=raw.trim(); if(!raw) return null;
  if(raw.includes(":")){ const [g,...n]=raw.split(":"); const gg=g.trim(); return {g:GROUPS[gg]?gg:"기타", n:n.join(":").trim()||gg}; }
  return {g:NAME2G[raw]||"기타", n:raw};
}
let sheetSig="";
async function loadSheet(){
  try{
    if(editing) return;
    let rows;
    if(API_URL){ const r=await fetch(API_URL+"?tab="+encodeURIComponent(TAB)+"&_="+Date.now()); const j=await r.json(); if(!j.ok) throw new Error("api");
      if(TAB && j.tab!==TAB){ tabMissing=true; editBtn.hidden=true; setStatus("유치부 시트 연결 준비 중 · 기본 계획표로 표시"); return; }
      rows=j.rows; }
    else { const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&_=${Date.now()}`,{cache:"no-store"});
      if(!r.ok) throw new Error(r.status);
      const txt=await r.text(); if(/^\s*</.test(txt)) throw new Error("not csv"); rows=parseCSV(txt); }
    const head=rows.shift().map(h=>String(h).trim()); const iExtra=head.indexOf("추가설정");
    const iDay=head.indexOf("일"), iNote=head.indexOf("전달사항"), iItems=head.map((h,i)=>h.startsWith("종목")?i:-1).filter(i=>i>=0);
    if(iDay<0) throw new Error("no header");
    const next={};
    rows.forEach(r=>{ const d=parseInt(r[iDay],10); if(!d||!PLAN.days[d]) return;
      const o={}; const items=iItems.map(i=>nameToItem(r[i]||"")).filter(Boolean);
      if(items.length && !isSpecial(d)) o.items=items;
      const n=(iNote>=0?String(r[iNote]||""):"").trim(); if(n) o.notice=n;
      if(iExtra>=0 && r[iExtra]){ try{ const x=JSON.parse(r[iExtra]); if(x.texts) o.texts=x.texts; if(Array.isArray(x.det)&&o.items) x.det.forEach((dd,k)=>{ if(o.items[k]&&dd) Object.assign(o.items[k],dd); }); }catch(e){} }
      next[d]=o; });
    const sig=JSON.stringify(next);
    if(sig!==sheetSig){ sheetSig=sig; Object.keys(STORE).forEach(k=>delete STORE[k]); Object.assign(STORE,next); if(!vpOpen) render(deck[cur]&&deck[cur].sid); }
    const t=new Date(); setStatus(`시트 연결됨 · ${t.getHours()}:${String(t.getMinutes()).padStart(2,"0")}`);
  }catch(e){ setStatus(API_URL?"시트 연결 실패 · 잠시 뒤 다시 시도":"시트를 못 읽었어요 · 공유 설정 확인",true); }
}
/* 홈페이지에서 고친 내용을 시트에 저장 (Apps Script 연결) */
function getPin(){ try{ return localStorage.getItem("poom-pin")||""; }catch(e){ return ""; } }
function rowFor(d){
  const s=STORE[d]||{}; const out={day:d, notice:s.notice||""};
  const ex={}; if(s.texts&&Object.keys(s.texts).length) ex.texts=s.texts;
  if(!isSpecial(d)){
    const items=itemsFor(d);
    out.items=items.map(it=> (NAME2G[it.n]===it.g || (it.g==="기타"&&!NAME2G[it.n])) ? it.n : `${it.g}:${it.n}`);
    const det=items.map(it=>{ const o={}; ["sub","how","v","ytx","lo","hi"].forEach(f=>{ if(it[f]!=null) o[f]=it[f]; }); return Object.keys(o).length?o:null; });
    if(det.some(Boolean)) ex.det=det;
  }
  out.extra=Object.keys(ex).length?ex:null;
  return out;
}
async function postDay(d){
  try{
    const body=Object.assign({pin:getPin(), tab:TAB}, rowFor(d));
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.ok){ setStatus("시트에 저장됨 ✓"); sheetSig=""; }
    else if(j.error==="pin"){ try{localStorage.removeItem("poom-pin")}catch(e){} setStatus("비밀번호가 바뀌었어요 · 다시 입력",true); if(editing) editBtn.click(); }
    else setStatus("저장 실패 · 다시 시도해 주세요",true);
  }catch(e){ setStatus("저장 실패 · 인터넷 연결 확인",true); }
}
function askPin(){
  const box=document.getElementById("sharebox"); box.querySelector("h3").textContent="수정 비밀번호";
  document.getElementById("drawer").hidden=true;
  sbody.innerHTML=`<div class="it"><p class="hint">관장님이 정한 수정용 비밀번호를 입력하세요. 이 기기에서는 한 번만 입력하면 됩니다.</p>
    <input type="password" id="pinin" inputmode="numeric" autocomplete="off" aria-label="수정 비밀번호" style="width:100%;box-sizing:border-box">
    <div class="row"><button class="dbtn" id="pinok">확인</button><span class="hint" id="pinmsg"></span></div></div>`;
  box.hidden=false; document.getElementById("pinin").focus();
  const go=async()=>{ const v=document.getElementById("pinin").value.trim(), m=document.getElementById("pinmsg"); if(!v) return; m.textContent="확인 중…";
    try{ const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({pin:v,check:true})}); const j=await r.json();
      if(j.ok){ try{localStorage.setItem("poom-pin",v)}catch(e){} box.hidden=true; editBtn.click(); }
      else m.textContent="비밀번호가 맞지 않아요"; }catch(e){ m.textContent="연결 실패 · 잠시 뒤 다시"; } };
  document.getElementById("pinok").onclick=go;
  document.getElementById("pinin").onkeydown=e=>{ if(e.key==="Enter") go(); };
}
function startSheet(){
  if(!LOCK){ const a=document.createElement("a"); a.href=SHEET_EDIT; a.target="_blank"; a.rel="noopener"; a.textContent="📝 시트에서 수정";
    a.style.cssText="background:#40382f;color:#f5ede3;border-radius:10px;height:40px;padding:0 12px;font:700 15px/40px var(--f-body);text-decoration:none;white-space:nowrap";
    document.getElementById("savest").before(a); }
  loadSheet(); setInterval(loadSheet,60000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) loadSheet(); });
}
/* 공유 저장소 연결: 다른 기기에서 고친 내용도 바로 반영 */
(async()=>{
  let user=null;
  try{ [db,user]=await Promise.all([window.claude?.use?.("db")??null, window.claude?.use?.("user")??null]); }catch(e){ db=null; }
  if(!db && EMBED){ canWrite=!!API_URL; editBtn.hidden=!canWrite; startSheet(); return; }
  if(!db){
    localOnly=true; canWrite=true;
    try{ Object.assign(STORE, JSON.parse(localStorage.getItem("poom-days")||"{}")); }catch(e){}
    editBtn.hidden=false; if(!LOCK) setStatus("이 기기에만 저장");
    render(deck[cur]&&deck[cur].sid); return;
  }
  let w=null; try{ w = user ? await user.can("data.write") : null; }catch(e){}
  canWrite = w!==false;
  editBtn.hidden=!canWrite;
  db.collection("days").onSnapshot(snap=>{
    let touched=false;
    snap.docChanges().forEach(ch=>{
      const d=+ch.doc.id.slice(1); if(!d) return;
      if(ch.type==="removed") delete STORE[d]; else STORE[d]=clone(ch.doc.data()||{});
      if(d===curDay || curDay==="month") touched=true;
    });
    const typing=document.activeElement&&(document.activeElement.closest("[data-k]")||document.activeElement.closest("#drawer"));
    if(touched && !typing && !vpOpen) render(deck[cur]&&deck[cur].sid);
  }, err=>{ setStatus("공유 저장소 연결이 끊겼어요",true); });
})();
